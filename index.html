<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Популярные Люди</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent-color: #2ecc71;
            --danger-color: #e74c3c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        /* Форма добавления */
        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #27ae60;
        }

        /* Сетка карточек */
        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #eaeaea;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-size: 20px;
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .card-reason {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
            flex-grow: 1;
        }

        .delete-btn {
            background-color: var(--danger-color);
            margin-top: 15px;
            font-size: 14px;
            padding: 5px 10px;
        }

        .delete-btn:hover {
            background-color: #c0392b;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Галерея Популярных Людей</h1>
        <p>Добавляйте личностей, которые вас вдохновляют, и описывайте причину выбора.</p>
    </header>

    <!-- Форма добавления -->
    <section class="form-section">
        <h2>Добавить нового человека</h2>
        <form id="personForm">
            <div class="form-group">
                <label for="name">Имя / Фамилия:</label>
                <input type="text" id="name" required placeholder="Например: Альберт Эйнштейн">
            </div>
            <div class="form-group">
                <label for="image">Ссылка на картинку (URL):</label>
                <input type="url" id="image" required placeholder="https://example.com">
            </div>
            <div class="form-group">
                <label for="reason">Почему вы его/ее добавили?</label>
                <textarea id="reason" required placeholder="Опишите заслуги или причину вашего выбора..."></textarea>
            </div>
            <button type="submit">Добавить в список</button>
        </form>
    </section>

    <!-- Список карточек -->
    <main class="people-grid" id="peopleGrid"></main>
</div>

<script>
    const personForm = document.getElementById('personForm');
    const peopleGrid = document.getElementById('peopleGrid');

    // Загрузка данных из localStorage
    let people = JSON.parse(localStorage.getItem('famousPeople')) || [];

    // Функция для отображения карточек
    function renderCards() {
        peopleGrid.innerHTML = '';
        
        if (people.length === 0) {
            peopleGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">Список пока пуст. Добавьте кого-нибудь!</p>';
            return;
        }

        people.forEach((person, index) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.innerHTML = `
                <img src="${person.image}" alt="${person.name}" onerror="this.src='https://unsplash.com'">
                <div class="card-content">
                    <h3 class="card-name">${person.name}</h3>
                    <p class="card-reason"><strong>Почему здесь:</strong> ${person.reason}</p>
                    <button class="delete-btn" onclick="deletePerson(${index})">Удалить</button>
                </div>
            `;
            peopleGrid.appendChild(card);
        });
    }

    // Обработчик отправки формы
    personForm.addEventListener('submit', (e) => {
        e.preventDefault();

        const name = document.getElementById('name').value;
        const image = document.getElementById('image').value;
        const reason = document.getElementById('reason').value;

        const newPerson = { name, image, reason };
        people.push(newPerson);

        // Сохраняем в localStorage
        localStorage.setItem('famousPeople', JSON.stringify(people));

        // Сбрасываем форму и обновляем интерфейс
        personForm.reset();
        renderCards();
    });

    // Функция удаления карточки
    window.deletePerson = function(index) {
        people.splice(index, 1);
        localStorage.setItem('famousPeople', JSON.stringify(people));
        renderCards();
    }

    // Инициализация при загрузке страницы
    renderCards();
</script>

</body>
</html>
