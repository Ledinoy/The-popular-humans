<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Общая Галерея Популярных Людей</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-color: #333;
            --accent-color: #3498db;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        h1 {
            color: #2c3e50;
        }

        .form-section {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 40px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            transition: background 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        .people-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        .card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            background-color: #eaeaea;
        }

        .card-content {
            padding: 15px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
        }

        .card-name {
            font-size: 20px;
            margin: 0 0 10px 0;
            color: #2c3e50;
        }

        .card-reason {
            font-size: 14px;
            color: #555;
            line-height: 1.4;
            flex-grow: 1;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Общая Галерея Популярных Людей</h1>
        <p>Добавьте запись с фото, и её **сразу же увидят все пользователи** сайта!</p>
    </header>

    <section class="form-section">
        <h2>Добавить человека в общую базу</h2>
        <form id="personForm">
            <div class="form-group">
                <label for="name">Имя / Фамилия:</label>
                <input type="text" id="name" required placeholder="Например: Стив Джобс">
            </div>
            <div class="form-group">
                <label for="imageFile">Загрузить фото (с устройства):</label>
                <input type="file" id="imageFile" accept="image/*" required>
            </div>
            <div class="form-group">
                <label for="reason">Почему вы его/ее добавили?</label>
                <textarea id="reason" required style="width:100%; height:100px; resize:vertical; padding:10px; border:1px solid #ddd; border-radius:4px; box-sizing:border-box;" placeholder="Ваше описание..."></textarea>
            </div>
            <button type="submit" id="submitBtn">Опубликовать для всех</button>
        </form>
    </section>

    <main class="people-grid" id="peopleGrid"></main>
</div>

<!-- Подключаем Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://gstatic.com";
  import { getDatabase, ref, push, onValue } from "https://gstatic.com";

  // Ваша конфигурация
  const firebaseConfig = {
    apiKey: "AIzaSyAeX4umHhqivgsDB0_2PRIUfZWJoNQRjVs",
    authDomain: "://firebaseapp.com",
    databaseURL: "https://firebaseio.com",
    projectId: "famous-people-db",
    storageBucket: "famous-people-db.firebasestorage.app",
    messagingSenderId: "1057156016505",
    appId: "1:1057156016505:web:b98b7a676047fd0eb727a8",
    measurementId: "G-YZY39T58J9"
  };

  // Инициализация
  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const peopleRef = ref(db, 'famousPeople');

  const personForm = document.getElementById('personForm');
  const peopleGrid = document.getElementById('peopleGrid');
  const submitBtn = document.getElementById('submitBtn');

  // Чтение данных в реальном времени
  onValue(peopleRef, (snapshot) => {
    peopleGrid.innerHTML = '';
    const data = snapshot.val();
    
    if (!data) {
        peopleGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777;">Никто еще ничего не добавил. Будьте первыми!</p>';
        return;
    }

    Object.values(data).reverse().forEach(person => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
            <img src="${person.image}" alt="${person.name}">
            <div class="card-content">
                <h3 class="card-name">${person.name}</h3>
                <p class="card-reason"><strong>Причина добавления:</strong> ${person.reason}</p>
            </div>
        `;
        peopleGrid.appendChild(card);
    });
  });

  // Отправка формы
  personForm.addEventListener('submit', (e) => {
    e.preventDefault();

    const name = document.getElementById('name').value;
    const reason = document.getElementById('reason').value;
    const fileInput = document.getElementById('imageFile');
    const file = fileInput.files[0]; // ИСПРАВЛЕНО: берем конкретно первый файл из списка

    if (!file) {
        alert("Пожалуйста, выберите файл изображения!");
        return;
    }

    submitBtn.disabled = true;
    submitBtn.innerText = "Публикация...";

    const reader = new FileReader();
    reader.onloadend = function() {
        const base64Image = reader.result;

        push(peopleRef, { 
            name: name, 
            image: base64Image, 
            reason: reason 
        }).then(() => {
            personForm.reset();
            submitBtn.disabled = false;
            submitBtn.innerText = "Опубликовать для всех";
        }).catch((error) => {
            alert("Ошибка Firebase: " + error.message);
            submitBtn.disabled = false;
            submitBtn.innerText = "Опубликовать для всех";
        });
    }
    reader.readAsDataURL(file);
  });
</script>

</body>
</html>
